<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Светлая тема (по умолчанию) */
      --bg: #f4f4f7;
      --surface: #ffffff;
      --text: #1a1a22;
      --text-muted: #7a7a85;
      --outline: #e3e3ea;
      --primary: #9966ff;
      --on-primary: #ffffff;
      --icon-bg: #f0eefc;
      --icon-color: #9966ff;
      --footer-bg: rgba(255, 255, 255, 0.7);
      --shadow: 0 8px 28px rgba(30, 30, 60, 0.10);
      --shadow-hover: 0 14px 32px rgba(153, 102, 255, 0.35);
    }

    /* Тёмная тема */
    :root[data-theme="dark"] {
      --bg: #0d0e12;
      --surface: #17181f;
      --text: #e6e1e5;
      --text-muted: #958da5;
      --outline: #2a2a36;
      --primary: #9966ff;
      --on-primary: #000000;
      --icon-bg: #23202e;
      --icon-color: #b794ff;
      --footer-bg: rgba(13, 14, 18, 0.7);
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --shadow-hover: 0 14px 32px rgba(153, 102, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Содержимое */
    main {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 72px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .heading {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 32px;
      text-align: center;
    }

    .links-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      text-decoration: none;
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--outline);
      border-radius: 18px;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: var(--shadow);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1),
                  box-shadow 0.25s ease,
                  border-color 0.25s ease,
                  background-color 0.25s ease,
                  color 0.25s ease;
    }

    .social-btn .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 12px;
      background-color: var(--icon-bg);
      color: var(--icon-color);
    }

    .social-btn .icon svg {
      width: 20px;
      height: 20px;
    }

    /* Подъём кнопки при наведении — только на устройствах с курсором */
    @media (hover: hover) and (pointer: fine) {
      .social-btn:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
        border-color: var(--primary);
      }
    }

    /* Кнопка в правом нижнем углу (переключение темы) */
    .theme-toggle {
      position: fixed;
      bottom: 84px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--outline);
      background-color: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1),
                  box-shadow 0.25s ease,
                  background-color 0.3s ease,
                  color 0.3s ease;
      z-index: 10;
    }

    .theme-toggle svg {
      width: 24px;
      height: 24px;
    }

    /* В светлой теме показываем луну (переключить на тёмную) */
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    /* В тёмной теме показываем солнце (переключить на светлую) */
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    @media (hover: hover) and (pointer: fine) {
      .theme-toggle:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }
    }

    /* Нижняя плашка */
    footer {
      width: 100%;
      padding: 16px 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: var(--footer-bg);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--outline);
    }

    footer .dot {
      margin: 0 8px;
      color: var(--primary);
    }
  </style>
</head>

  <script>
    (function () {
      const root = document.documentElement;
      const toggleBtn = document.getElementById('themeToggle');
      const media = window.matchMedia('(prefers-color-scheme: dark)');

      // Текущая тема: ручной выбор или тема браузера
      function effectiveTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          return saved;
        }
        return media.matches ? 'dark' : 'light';
      }

      function applyTheme() {
        root.setAttribute('data-theme', effectiveTheme());
      }

      // Ручное переключение с запоминанием
      toggleBtn.addEventListener('click', () => {
        localStorage.setItem('theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
        applyTheme();
      });

      // Следим за сменой темы браузера, пока нет ручного выбора
      media.addEventListener('change', () => {
        if (!localStorage.getItem('theme')) {
          applyTheme();
        }
      });

      applyTheme();
    })();
  </script>
